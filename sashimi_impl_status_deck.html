<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>회뜨기 — 현재 구현 상태 슬라이드</title>
<style>
  :root{
    --bg:#11151c; --panel:#1a2029; --line:#2c3644; --ink:#e8edf4; --dim:#93a1b5;
    --ok:#4ade80; --warn:#fbbf24; --no:#f87171; --acc:#60a5fa; --code:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  header{
    display:flex;align-items:center;gap:14px;padding:12px 22px;
    border-bottom:1px solid var(--line);background:#0d1117;flex:0 0 auto;
  }
  header h1{font-size:15px;font-weight:700;letter-spacing:-.2px}
  header .sub{font-size:12px;color:var(--dim)}
  header .spacer{flex:1}
  .counter{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim)}
  .bar{height:3px;background:#0d1117;flex:0 0 auto}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#a78bfa);transition:width .25s}

  main{flex:1;overflow:hidden;position:relative}
  .slide{
    position:absolute;inset:0;padding:26px 34px 18px;
    display:none;flex-direction:column;gap:16px;overflow:auto;
  }
  .slide.on{display:flex;animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .head{display:flex;align-items:flex-start;gap:16px}
  .num{
    flex:0 0 auto;width:54px;height:54px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;background:#20293a;color:var(--acc);
    border:1px solid var(--line);font-variant-numeric:tabular-nums;
  }
  .titles h2{font-size:27px;font-weight:800;letter-spacing:-.6px;line-height:1.2}
  .titles .grp{font-size:12px;color:var(--dim);margin-bottom:4px;letter-spacing:.4px}
  .titles code{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;
    color:var(--code);background:#221d33;padding:2px 8px;border-radius:6px;
    display:inline-block;margin-top:7px;border:1px solid #342a52;
  }
  .head .spacer{flex:1}
  .badges{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .b{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;border:1px solid}
  .b.ok{color:var(--ok);border-color:#1d5638;background:#0f2a1c}
  .b.warn{color:var(--warn);border-color:#5c451a;background:#2a2010}
  .b.no{color:var(--no);border-color:#5c2626;background:#2a1414}
  .b.src{color:var(--dim);border-color:var(--line);background:#151b24;font-weight:600}

  .body{display:grid;grid-template-columns:minmax(0,1fr) 560px;gap:28px;flex:1;min-height:0;align-items:center}

  /* 17-스테이지 레일 */
  .rail{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;margin-top:2px}
  .rail .track{display:flex;gap:4px}
  .rail .seg{display:flex;flex-direction:column;gap:4px;flex:1}
  .rail .seg .lbl{font-size:10px;color:#5f6d82;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail .seg .cells{display:flex;gap:3px}
  .rail .cell{
    flex:1;height:22px;border-radius:5px;background:#1b2330;border:1px solid #26303f;
    display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#5f6d82;
    font-variant-numeric:tabular-nums;
  }
  .rail .cell.past{background:#25384a;color:#a9c0d6;border-color:#35506a}
  .rail .cell.now{background:var(--acc);color:#0d1117;font-weight:800;border-color:var(--acc);height:26px;margin-top:-2px}
  .body.nopanel{grid-template-columns:minmax(0,1fr)}

  .facts{display:flex;flex-direction:column;gap:11px}
  .row{
    display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 15px;
  }
  .row .k{font-size:11.5px;color:var(--dim);font-weight:700;padding-top:1px;letter-spacing:.3px}
  .row .v{font-size:14px;line-height:1.6}
  .row .v em{font-style:normal;color:var(--acc);font-weight:700}
  .row .v b{color:var(--warn)}
  .row .v .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--code)}

  .note{
    font-size:12.5px;line-height:1.6;color:var(--dim);
    border-left:3px solid #3a4557;padding:8px 0 8px 12px;
  }
  .note.gap{border-left-color:var(--no);color:#fca5a5}

  .panelbox{display:flex;flex-direction:column;gap:8px;min-width:0}
  .panelbox img{
    width:100%;border-radius:12px;border:1px solid var(--line);
    background:#e9edf1;image-rendering:pixelated;
  }
  .panelbox .cap{font-size:11.5px;color:var(--dim);text-align:center;line-height:1.5}
  .panelbox .none{
    min-height:300px;flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
    border:1px dashed #38445a;border-radius:12px;color:#5f6d82;font-size:13px;padding:20px;line-height:1.7;
  }

  /* orientation strip */
  .ori{display:flex;gap:5px;margin-top:2px}
  .ori span{
    font-size:10.5px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);
    color:#5f6d82;background:#141a23;font-family:ui-monospace,monospace;
  }
  .ori span.hit{color:#0d1117;background:var(--acc);border-color:var(--acc);font-weight:700}

  /* tables (overview / gap slides) */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{color:var(--dim);font-size:11px;letter-spacing:.4px;background:#141a23;position:sticky;top:0}
  td.c{text-align:center}
  tr.grpline td{background:#161d27;font-weight:700;color:var(--acc);font-size:12px}
  .tag{font-size:10.5px;padding:2px 7px;border-radius:5px;border:1px solid;white-space:nowrap}
  .tag.ok{color:var(--ok);border-color:#1d5638}
  .tag.no{color:var(--no);border-color:#5c2626}
  .tag.warn{color:var(--warn);border-color:#5c451a}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;min-height:0;flex:1}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:auto}
  .card h3{font-size:14px;margin-bottom:10px;color:var(--acc)}
  .card ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  .card li{font-size:12.8px;line-height:1.55;padding-left:15px;position:relative;color:#cbd5e1}
  .card li:before{content:"▸";position:absolute;left:0;color:#4b5a70}
  .card li b{color:var(--ink)}

  footer{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 22px;
    border-top:1px solid var(--line);background:#0d1117;
  }
  .dots{display:flex;gap:3px;flex:1;flex-wrap:wrap}
  .dots i{
    width:15px;height:15px;border-radius:4px;background:#212a37;cursor:pointer;
    font-size:9px;display:flex;align-items:center;justify-content:center;color:#5f6d82;
    font-style:normal;font-variant-numeric:tabular-nums;
  }
  .dots i.on{background:var(--acc);color:#0d1117;font-weight:700}
  .dots i.gapd{background:#3a2020}
  .dots i.gapd.on{background:var(--no);color:#0d1117}
  button{
    background:#212a37;color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;
  }
  button:hover{background:#2b3644}
  .hint{font-size:11px;color:#5f6d82}
</style>
</head>
<body>
<header>
  <h1>회뜨기 — 현재 인게임 구현 상태</h1>
  <span class="sub">Pixel Angler The Real · ButcheryProcess 17스테이지</span>
  <span class="spacer"></span>
  <span class="counter" id="cnt"></span>
</header>
<div class="bar"><i id="bar"></i></div>
<main id="main"></main>
<footer>
  <button onclick="go(-1)">← 이전</button>
  <button onclick="go(1)">다음 →</button>
  <div class="dots" id="dots"></div>
  <span class="hint">← → 방향키 · 클릭</span>
</footer>

    <td class="c"><span class="tag ${s.state==='done'?'ok':s.state==='partial'?'warn':'no'}">${s.state==='done'?'완료':s.state==='partial'?'부분':'미구현'}</span></td>
  </tr>`;
});
html += `<section class="slide">
  <div class="head"><div class="num">📋</div><div class="titles">
    <div class="grp">개요</div><h2>구현된 17스테이지 — 전체 순서</h2>
    <code>E2E 17스테이지 PASS (43차 STAGE_FLOW_FIX 완료 기준)</code>
  </div></div>
  <div style="flex:1;overflow:auto;border:1px solid var(--line);border-radius:10px">
  <table><thead><tr><th style="width:38px">#</th><th>스테이지</th><th style="width:150px">id</th>
  <th style="width:110px">프리미티브</th><th style="width:150px">orientation</th><th style="width:76px">상태</th></tr></thead>
  <tbody>${rows}</tbody></table></div>
  <div class="note">방향 전환은 <b>자동</b>이다 — <span class="mono">advance()</span>는 orientation을 유지하고(<span class="mono">L439~443</span>), 클라이언트가 다음 스테이지의 요구 방향으로 220ms 애니메이션을 재생한 뒤 입력을 연다. 플레이어가 직접 뒤집을 필요는 없지만 1~5 키로 수동 전환도 가능하다.</div>
</section>`;

// ---------- 2..N. 스테이지별 ----------
STAGES.forEach((s,i) => {
  const p = s.panel ? PANELS[s.panel] : null;
  const panelHtml = p
    ? `<div class="panelbox"><img src="${p}" alt="">${s.panelCap?`<div class="cap">${s.panelCap}</div>`:''}</div>`
    : `<div class="panelbox"><div class="none">47컷 가이드에 대응 컷 없음<br><span style="font-size:11.5px">${s.noPanelWhy}</span></div></div>`;
  const railHtml = (() => {
    const segs = []; let last = null;
    STAGES.forEach((x,k) => {
      if (x.grp !== last){ segs.push({lbl:x.grp, idx:[]}); last = x.grp; }
      segs[segs.length-1].idx.push(k);
    });
    return '<div class="rail"><div class="track">' + segs.map(sg =>
      `<div class="seg" style="flex:${sg.idx.length}"><div class="cells">` +
      sg.idx.map(k => `<div class="cell ${k===i?'now':(k<i?'past':'')}">${k+1}</div>`).join('') +
      `</div><div class="lbl">${sg.lbl}</div></div>`).join('') + '</div></div>';
  })();
  html += `<section class="slide">
    <div class="head">
      <div class="num">${i+1}</div>
      <div class="titles">
        <div class="grp">${s.grp}</div>
        <h2>${s.title}</h2>
        <code>${s.id}</code>
        ${oriStrip(s.ori)}
      </div>
      <div class="spacer"></div>
      <div class="badges">${badge(s.state)}${srcBadge(s.src)}</div>
    </div>
    <div class="body">
      <div class="facts">
        <div class="row"><div class="k">가이드 대응</div><div class="v">${s.guide}</div></div>
        <div class="row"><div class="k">입력</div><div class="v">${s.input}</div></div>
        <div class="row"><div class="k">판정</div><div class="v">${s.judge}</div></div>
        <div class="row"><div class="k">결과 · 상태변화</div><div class="v">${s.result}</div></div>
        ${s.gap ? `<div class="note gap">${s.gap}</div>` : ''}
        ${s.note ? `<div class="note">${s.note}</div>` : ''}
      </div>
      ${panelHtml}
    </div>
    ${railHtml}
  </section>`;
});

// ---------- 격차 슬라이드 ----------
html += EXTRA;

main.innerHTML = html;

const slides = [...document.querySelectorAll('.slide')];
const dots = document.getElementById('dots');
slides.forEach((s,i) => {
  const d = document.createElement('i');
  d.textContent = (i>=2 && i<2+STAGES.length) ? (i-1) : '';
  if (i >= 2+STAGES.length) d.className = 'gapd';
  d.onclick = () => set(i);
  dots.appendChild(d);
});
let cur = 0;
function set(i){
  cur = Math.max(0, Math.min(slides.length-1, i));
  slides.forEach((s,k) => s.classList.toggle('on', k===cur));
  [...dots.children].forEach((d,k) => d.classList.toggle('on', k===cur));
  document.getElementById('cnt').textContent = `${cur+1} / ${slides.length}`;
  document.getElementById('bar').style.width = ((cur+1)/slides.length*100)+'%';
  const s = slides[cur]; if (s) s.scrollTop = 0;
}
function go(d){ set(cur+d); }
addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') { go(1); e.preventDefault(); }
  if (e.key==='ArrowLeft'||e.key==='PageUp') { go(-1); e.preventDefault(); }
  if (e.key==='Home') set(0);
  if (e.key==='End') set(slides.length-1);
});
set(0);
</script>
</body>
</html>
