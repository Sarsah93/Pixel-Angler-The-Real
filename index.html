<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pixel Angler The Real — 하이퍼 리얼리즘 2D 도트 바다 낚시 시뮬레이터" />
    <title>Pixel Angler The Real</title>
    <link rel="icon" type="image/png" href="ui/app_icon.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0e14;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
        /*
         * 최종 프레임버퍼(1280×720) → 창 확대 단계만 부드럽게(bilinear) 처리해
         * 비정수 FIT 배율(예: 1.5배)에서 작은 글자가 계단식으로 뭉개지던 문제를 제거한다.
         * 내부 렌더는 PhaserConfig의 pixelArt:true(NEAREST) 그대로 유지되므로
         * 타일 베이킹·도트 에셋의 내부 선명도에는 영향이 없다(마지막 present만 스무딩).
         * Phaser는 antialias:false일 때 캔버스에 inline으로 image-rendering:pixelated를
         * 걸어두는데(CreateRenderer setCrisp), author 스타일시트의 !important 선언이
         * normal inline 선언을 이기므로 이 한 줄로 both(스타일시트+Phaser inline)를 덮어쓴다.
         */
        image-rendering: auto !important;
      }
      /* 219차 — 로딩 가림막(ui/LoadingOverlay.ts). 페이지를 열자마자 보이고, 메인 화면이 그려지면 걷힌다 */
      #loading-overlay {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #0a0e14; color: #e8f4fd; opacity: 1; transition: opacity 0.25s ease;
        font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        user-select: none; pointer-events: auto;
      }
      #loading-overlay.lo-fading { opacity: 0; pointer-events: none; }
      #loading-overlay.lo-hidden { display: none; }
      #loading-overlay .lo-title {
        font-family: "Press Start 2P", monospace; font-size: 22px; letter-spacing: 2px;
        text-shadow: 3px 3px 0 #001a33;
      }
      #loading-overlay .lo-stage { font-size: 15px; color: #8fb8cf; min-height: 22px; }
      #loading-overlay .lo-bar {
        width: min(360px, 70vw); height: 8px; background: #1a2535; border: 1px solid #2c4258; visibility: hidden;
      }
      #loading-overlay .lo-fill { width: 0%; height: 100%; background: #4af2a1; transition: width 0.15s linear; }
    </style>
    <script type="module" crossorigin src="./assets/index-DcJTTOAk.js"></script>
  </head>
  <body>
    <div id="loading-overlay"><div class="lo-title">Loading...</div><div class="lo-stage"></div><div class="lo-bar"><div class="lo-fill"></div></div></div>
  </body>
</html>
