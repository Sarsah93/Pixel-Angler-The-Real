<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="'Segoe UI','Noto Sans KR',sans-serif">
  <defs>
    <pattern id="floor" width="120" height="36" patternUnits="userSpaceOnUse">
      <rect width="120" height="36" fill="#e0a95c"/>
      <line x1="0" y1="0" x2="120" y2="0" stroke="#b8823e" stroke-width="2"/>
      <line x1="60" y1="0" x2="60" y2="36" stroke="#b8823e" stroke-width="1.6"/>
      <line x1="0" y1="18" x2="0" y2="18" stroke="#b8823e"/>
    </pattern>
  </defs>
  <rect width="1100" height="760" fill="#f7f9fb"/>
  <text x="24" y="34" fill="#0d2740" font-size="21" font-weight="800">집 실내 예상도 — 소형 원룸 (침대 저장★) · 추후 확장형</text>
  <text x="24" y="56" fill="#5b7186" font-size="12.5">캡처 스타일 소형 시작 → 지하실·평수·층수 확장은 HouseTier 스키마로. 문(하단) = 홈타운 외부로.</text>

  <!-- ===== 실내 맵 (12×10 타일 스케일) ===== -->
  <g>
    <!-- 외곽 프레임(벽) -->
    <rect x="60" y="80" width="620" height="600" fill="#5a3428"/>
    <rect x="84" y="104" width="572" height="552" fill="url(#floor)"/>
    <!-- 상단 벽 밴드 -->
    <rect x="84" y="104" width="572" height="86" fill="#a8aab0"/>
    <rect x="84" y="182" width="572" height="8" fill="#8a8c92"/>

    <!-- 벽 장식: 시계, 선반 -->
    <g transform="translate(150,124)"><circle r="20" fill="#c9a05a" stroke="#7a5a2a" stroke-width="3"/><circle r="14" fill="#f2ead2"/><line x1="0" y1="0" x2="0" y2="-8" stroke="#333" stroke-width="2"/><line x1="0" y1="0" x2="6" y2="3" stroke="#333" stroke-width="2"/></g>
    <g transform="translate(300,132)"><rect x="-40" y="0" width="80" height="10" fill="#8a5a34"/><rect x="-30" y="-16" width="14" height="16" fill="#b03a2e"/><rect x="-12" y="-20" width="12" height="20" fill="#3f6fa0"/><rect x="4" y="-14" width="14" height="14" fill="#3f7a34"/></g>

    <!-- 침대 (상단 중우측) = 저장★ -->
    <g transform="translate(470,150)">
      <rect x="-36" y="-24" width="72" height="150" rx="8" fill="#2a2e38"/>
      <rect x="-30" y="-18" width="60" height="42" fill="#f2ead2"/>
      <rect x="-30" y="26" width="60" height="98" fill="#b03a4a"/>
      <circle cx="0" cy="6" r="16" fill="#f5d9b8"/>
      <rect x="-32" y="128" width="64" height="14" rx="4" fill="#3f6fa0"/>
      <g transform="translate(58,-6)">
        <rect x="0" y="0" width="86" height="30" rx="6" fill="#dff0e6" stroke="#2e7d4f" stroke-width="2"/>
        <text x="43" y="20" fill="#1d5a38" font-size="12" text-anchor="middle" font-weight="700">저장★ 침대</text>
      </g>
    </g>

    <!-- 협탁 + 화분 (침대 우측 벽) -->
    <g transform="translate(600,160)">
      <rect x="-24" y="0" width="48" height="64" rx="4" fill="#a06a34"/><rect x="-18" y="10" width="36" height="12" fill="#7a4a24"/><rect x="-18" y="34" width="36" height="12" fill="#7a4a24"/>
      <g transform="translate(0,-16)"><rect x="-10" y="0" width="20" height="14" fill="#c46a3a"/><path d="M-6,-2 q6,-14 12,-2 q-6,4 -12,2" fill="#3f7a34"/></g>
    </g>

    <!-- 냉장고 (좌상 — 벽면) -->
    <g transform="translate(150,210)">
      <rect x="-28" y="-52" width="56" height="104" rx="6" fill="#dfe5ea" stroke="#9aa4ae" stroke-width="2"/>
      <line x1="-28" y1="-14" x2="28" y2="-14" stroke="#9aa4ae" stroke-width="2"/>
      <rect x="16" y="-40" width="5" height="18" rx="2" fill="#7a848e"/>
      <rect x="16" y="-4" width="5" height="26" rx="2" fill="#7a848e"/>
      <text x="0" y="72" fill="#33475a" font-size="10" text-anchor="middle">냉장고 (식재료 냉장 보관)</text>
    </g>

    <!-- 아일랜드 테이블 + 의자 2 (좌중앙) -->
    <g transform="translate(300,285)">
      <rect x="-62" y="-24" width="124" height="48" rx="8" fill="#c8a06a" stroke="#8a5a2a" stroke-width="2.5"/>
      <rect x="-54" y="-16" width="108" height="12" rx="4" fill="#e8d8b8"/>
      <circle cx="-34" cy="46" r="13" fill="#a06a34" stroke="#6a4a2a" stroke-width="2"/>
      <circle cx="34" cy="46" r="13" fill="#a06a34" stroke="#6a4a2a" stroke-width="2"/>
      <text x="0" y="-36" fill="#5a4028" font-size="10" text-anchor="middle">아일랜드 테이블 + 의자</text>
    </g>

    <!-- 소파 (러그 좌측 — 우향) -->
    <g transform="translate(296,470)">
      <rect x="-24" y="-52" width="48" height="104" rx="10" fill="#7a4a6a" stroke="#4a2a44" stroke-width="2.5"/>
      <rect x="-24" y="-52" width="16" height="104" rx="8" fill="#5a3450"/>
      <rect x="-4" y="-46" width="24" height="44" rx="6" fill="#96628a"/>
      <rect x="-4" y="2" width="24" height="44" rx="6" fill="#96628a"/>
      <text x="0" y="70" fill="#4a2a44" font-size="10" text-anchor="middle">소파</text>
    </g>

    <!-- 러그 + 고양이 -->
    <g transform="translate(430,470)">
      <rect x="-80" y="-60" width="160" height="120" rx="8" fill="#4a7a54"/>
      <rect x="-70" y="-50" width="140" height="100" rx="6" fill="none" stroke="#e8d8a8" stroke-width="2"/>
      <g transform="translate(-6,-4)"><ellipse rx="20" ry="10" fill="#c48a4a"/><circle cx="18" cy="-6" r="7" fill="#c48a4a"/><path d="M14,-12 l3,-6 3,6 M20,-12 l3,-6 3,6" stroke="#c48a4a" stroke-width="2" fill="none"/><path d="M-18,2 q-10,-8 -6,-16" stroke="#c48a4a" stroke-width="4" fill="none"/></g>
    </g>

    <!-- 서랍장 + 램프 (우하) -->
    <g transform="translate(590,470)">
      <rect x="-30" y="-40" width="60" height="110" rx="4" fill="#a06a34"/><rect x="-22" y="-28" width="44" height="18" fill="#7a4a24"/><rect x="-22" y="0" width="44" height="18" fill="#7a4a24"/><circle cx="0" cy="38" r="6" fill="#f2ead2"/>
      <g transform="translate(0,-84)"><rect x="-4" y="10" width="8" height="34" fill="#6a4a2a"/><path d="M-22,10 L22,10 L12,-14 L-12,-14 Z" fill="#e8b04a"/></g>
    </g>

    <!-- 수납 선반(좌하) + 화분 -->
    <g transform="translate(170,540)">
      <rect x="-46" y="-64" width="92" height="128" fill="#6a3a1e"/><rect x="-38" y="-52" width="76" height="30" fill="#c48a4a"/><rect x="-38" y="-12" width="76" height="30" fill="#8a5a2a"/><rect x="-38" y="28" width="76" height="26" fill="#c48a4a"/>
    </g>
    <g transform="translate(300,590)"><rect x="-14" y="8" width="28" height="22" fill="#c46a3a"/><path d="M0,8 q-18,-26 -6,-38 q6,10 6,16 q2,-16 12,-20 q4,16 -6,28 q10,-6 16,-2 q-8,12 -22,16" fill="#3f7a34"/></g>

    <!-- 문 (하단 중앙) → 외부 -->
    <g transform="translate(400,660)">
      <rect x="-34" y="-18" width="68" height="38" rx="4" fill="#5a4028"/>
      <rect x="-26" y="-12" width="52" height="26" fill="#8a5a2a"/>
      <text x="0" y="42" fill="#0d2740" font-size="11.5" text-anchor="middle" font-weight="700">문 → 홈타운 외부</text>
    </g>

    <!-- 확장 훅 표시 -->
    <g stroke="#2f7fd0" stroke-width="2" stroke-dasharray="6 4" fill="none">
      <rect x="90" y="300" width="56" height="70"/>
    </g>
    <text x="118" y="392" fill="#2f7fd0" font-size="10" text-anchor="middle">지하실 계단</text>
    <text x="118" y="406" fill="#2f7fd0" font-size="10" text-anchor="middle">(확장 예약)</text>
    <!-- 관상용 수족관 자리 (예약) -->
    <g transform="translate(596,282)">
      <rect x="0" y="0" width="52" height="86" fill="none" stroke="#2f7fd0" stroke-width="2" stroke-dasharray="6 4"/>
      <path d="M6,60 q8,-7 16,0 q8,7 16,0" fill="none" stroke="#2f7fd0" stroke-width="1.3" opacity="0.7"/>
      <circle cx="18" cy="34" r="4" fill="none" stroke="#2f7fd0" stroke-width="1.3" opacity="0.7"/>
      <text x="26" y="100" fill="#2f7fd0" font-size="9.5" text-anchor="middle">관상용 수족관</text>
      <text x="26" y="112" fill="#2f7fd0" font-size="9.5" text-anchor="middle">예시 위치(자유 배치)</text>
    </g>
    <!-- 설치 모드 그리드 데모 (실내 — 서랍장 겹침=빨강) -->
    <g transform="translate(478,360)">
      <g stroke="#0d2740" stroke-width="0.8" opacity="0.9">
        <rect x="0"  y="0"  width="28" height="28" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="28" y="0"  width="28" height="28" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="56" y="0"  width="28" height="28" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="84" y="0"  width="28" height="28" fill="#ff5a4a" fill-opacity="0.55"/>
        <rect x="0"  y="28" width="28" height="28" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="28" y="28" width="28" height="28" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="56" y="28" width="28" height="28" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="84" y="28" width="28" height="28" fill="#ff5a4a" fill-opacity="0.55"/>
      </g>
      <text x="56" y="-8" fill="#0d2740" font-size="10" text-anchor="middle" font-weight="700">설치 모드: 초록=가능 / 빨강=가구 겹침</text>
    </g>
    <path d="M680,380 h34" stroke="#2f7fd0" stroke-width="3" marker-end="none"/>
    <text x="700" y="368" fill="#2f7fd0" font-size="10">평수 확장 →</text>
  </g>

  <!-- ===== 우측: 스키마/확장 ===== -->
  <g>
    <rect x="740" y="80" width="336" height="600" rx="10" fill="#ffffff" stroke="#d3dde6"/>
    <text x="758" y="110" fill="#0d2740" font-size="14" font-weight="700">실내 스키마 · 확장 로드맵</text>

    <text x="758" y="140" fill="#0d2740" font-size="12" font-weight="700">시작 사이즈 (Tier 0)</text>
    <text x="758" y="160" fill="#334" font-size="11">· 원룸 12×10 타일 (캡처 스케일)</text>
    <text x="758" y="178" fill="#334" font-size="11">· 침대(저장★) · 협탁 · 서랍장 · 러그</text>
    <text x="758" y="196" fill="#334" font-size="11">· 냉장고 · 아일랜드 테이블+의자 · 소파</text>
    <text x="758" y="214" fill="#7a8a99" font-size="10.5">· 수납 선반 · 화분 · 시계 / 조리설비(스토브)는 Tier 1</text>

    <line x1="758" y1="232" x2="1058" y2="232" stroke="#e0e6ec"/>
    <text x="758" y="256" fill="#0d2740" font-size="12" font-weight="700">HouseTier 스키마 (확장)</text>
    <text x="758" y="278" fill="#334" font-size="10.5" font-family="monospace">interface HouseTier {</text>
    <text x="770" y="294" fill="#334" font-size="10.5" font-family="monospace">tier: 0|1|2|3;</text>
    <text x="770" y="310" fill="#334" font-size="10.5" font-family="monospace">interiorMapId: string;</text>
    <text x="770" y="326" fill="#334" font-size="10.5" font-family="monospace">sizeW,H: number;</text>
    <text x="770" y="342" fill="#334" font-size="10.5" font-family="monospace">features: ('kitchen'|'basement'</text>
    <text x="782" y="358" fill="#334" font-size="10.5" font-family="monospace">|'floor2'|'storage')[];</text>
    <text x="758" y="374" fill="#334" font-size="10.5" font-family="monospace">}</text>
    <text x="758" y="396" fill="#7a8a99" font-size="10.5">Tier별 실내 맵 JSON 교체 방식 —</text>
    <text x="758" y="412" fill="#7a8a99" font-size="10.5">가구 배치는 유지·이전.</text>

    <line x1="758" y1="430" x2="1058" y2="430" stroke="#e0e6ec"/>
    <text x="758" y="454" fill="#0d2740" font-size="12" font-weight="700">확장 로드맵</text>
    <text x="758" y="474" fill="#334" font-size="11">Tier 1: 평수 확장 + 주방(요리)</text>
    <text x="758" y="492" fill="#334" font-size="11">Tier 2: 지하실 (수납/작업실)</text>
    <text x="758" y="510" fill="#334" font-size="11">Tier 3: 2층 (침실 분리 등)</text>
    <text x="758" y="532" fill="#7a8a99" font-size="10.5">비용/재료·목수 NPC는 추후 경제 연동.</text>

    <line x1="758" y1="550" x2="1058" y2="550" stroke="#e0e6ec"/>
    <text x="758" y="574" fill="#0d2740" font-size="12" font-weight="700">저장 규칙</text>
    <text x="758" y="594" fill="#334" font-size="11">· 침대 상호작용 = 유일한 저장 지점</text>
    <text x="758" y="612" fill="#334" font-size="11">· "저장하고 쉬기" / "그냥 쉬기"</text>
    <text x="758" y="630" fill="#334" font-size="11">· 낚시 지역 저장 불가(안내)</text>
    <text x="758" y="648" fill="#7a8a99" font-size="10.5">· 씬: CondoScene 개조(HomeInterior)</text>
    <text x="758" y="666" fill="#7a8a99" font-size="10.5">· 복귀: scene.stop() + resume 규칙</text>
  </g>

  <text x="24" y="722" fill="#7a8a99" font-size="11">가구 = MapObject(instanceId·collides·interact) — 전부 이동/제거/배치 가능 스탠바이(WorldObjectState 영속). 설치형은 칸 단위 자유 배치.</text>
  <text x="24" y="742" fill="#2f7fd0" font-size="11">수족관 2종(활어 업소용/관상용)·텃밭·울타리·가구 = 동일 배치 파이프(PlacementRule·canPlaceAt·초록/빨강 프리뷰). 표시 위치는 예시.</text>
</svg>
