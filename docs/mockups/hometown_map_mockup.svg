<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="'Segoe UI','Noto Sans KR',sans-serif">
  <defs>
    <pattern id="waves" width="46" height="18" patternUnits="userSpaceOnUse">
      <path d="M0,9 q11,-7 23,0 q11,7 23,0" fill="none" stroke="#bfe4f8" stroke-width="1.4" opacity="0.5"/>
    </pattern>
    <pattern id="grass" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#7cb85a"/>
      <rect x="4" y="6" width="2" height="4" fill="#8fca6c"/><rect x="16" y="16" width="2" height="4" fill="#6aa84c"/>
      <rect x="20" y="4" width="2" height="3" fill="#8fca6c"/><rect x="9" y="19" width="2" height="3" fill="#6aa84c"/>
    </pattern>
  </defs>
  <rect width="1280" height="860" fill="#f7f9fb"/>
  <text x="24" y="34" fill="#0d2740" font-size="21" font-weight="800">홈타운(집) 예상도 — 단일 맵 · 바다 30% / 땅 70% · 경계 밖 이동 불가</text>
  <text x="24" y="56" fill="#5b7186" font-size="12.5">캡처1 스타일 집 + 캡처3보다 넓은 마당 + 캡처2식 이동가능/불가 오브젝트. 저장은 집(침대)에서만.</text>

  <!-- ===== 맵 프레임 (경계 = 이동 불가) ===== -->
  <g>
    <rect x="24" y="72" width="960" height="700" fill="url(#grass)" stroke="#0d2740" stroke-width="4"/>

    <!-- 바다 (좌측+좌하 ≈30%) -->
    <path d="M24,72 L268,72 Q236,190 258,300 Q276,392 236,480 Q206,556 268,624 Q320,690 300,772 L24,772 Z" fill="#3f8fc4"/>
    <path d="M24,72 L268,72 Q236,190 258,300 Q276,392 236,480 Q206,556 268,624 Q320,690 300,772 L24,772 Z" fill="url(#waves)"/>
    <!-- 모래 해변 전이 -->
    <path d="M268,72 Q236,190 258,300 Q276,392 236,480 Q206,556 268,624 Q320,690 300,772 L332,772 Q352,688 302,620 Q246,556 272,484 Q310,394 292,300 Q272,192 300,72 Z" fill="#e8d8a8"/>

    <!-- 선착장(피어) + 보트 -->
    <rect x="120" y="404" width="150" height="26" fill="#8a6a44"/>
    <g stroke="#5a4028" stroke-width="2"><line x1="130" y1="404" x2="130" y2="430"/><line x1="180" y1="404" x2="180" y2="430"/><line x1="230" y1="404" x2="230" y2="430"/></g>
    <ellipse cx="96" cy="440" rx="34" ry="12" fill="#c4552e"/><rect x="76" y="424" width="40" height="10" fill="#e8e0d0"/>
    <text x="150" y="396" fill="#0d2740" font-size="11" font-weight="700">선착장 (추후 개인 보트 출조)</text>

    <!-- 집 (울타리 없음 — 추후 제작 아이템으로 설치 가능) — 상단 중앙 -->
    <g>
      <!-- 집 -->
      <rect x="510" y="150" width="170" height="110" fill="#8898a8"/>
      <polygon points="500,150 690,150 595,96" fill="#b03a2e"/>
      <rect x="580" y="210" width="32" height="50" fill="#5a4028"/>
      <rect x="530" y="180" width="28" height="22" fill="#bfe4f8"/><rect x="632" y="180" width="28" height="22" fill="#bfe4f8"/>
      <text x="595" y="278" fill="#0d2740" font-size="12" text-anchor="middle" font-weight="700">집 (문 → 실내맵 · 침대 저장★)</text>
      <text x="595" y="86" fill="#8a4a2e" font-size="10.5" text-anchor="middle">울타리 없음 — 추후 '울타리' 제작 아이템으로 자유 설치</text>
      <!-- 마당 텃밭 (예시 위치 — 자유 배치) -->
      <rect x="446" y="292" width="120" height="64" fill="#a8845a" opacity="0.65" stroke="#6a4a2a" stroke-dasharray="6 4"/>
      <text x="506" y="322" fill="#4a3018" font-size="10" text-anchor="middle">텃밭 예시 위치</text>
      <text x="506" y="334" fill="#4a3018" font-size="9" text-anchor="middle">(개간 아이템 → 비충돌 어디든)</text>
      <!-- 마당 오브젝트 -->
      <circle cx="640" cy="320" r="16" fill="#4a8a3a"/><rect x="636" y="332" width="8" height="10" fill="#6a4a2a"/>
      <circle cx="690" cy="330" r="12" fill="#4a8a3a"/>
    </g>

    <!-- 길 (집 → 우하단 버스정류장 / 좌측 선착장) -->
    <path d="M596,370 L596,470 Q596,520 660,520 L840,520 Q890,520 890,570 L890,700" stroke="#d8c8a0" stroke-width="34" fill="none" stroke-linecap="round"/>
    <path d="M596,470 Q520,470 460,470 Q380,470 340,440 L272,428" stroke="#d8c8a0" stroke-width="26" fill="none" stroke-linecap="round"/>

    <!-- 버스정류장 (출조 지점) -->
    <g transform="translate(846,690)">
      <rect x="0" y="0" width="90" height="54" rx="6" fill="#0d2740"/>
      <rect x="8" y="8" width="74" height="24" rx="3" fill="#3f8fc4"/>
      <text x="45" y="24" fill="#fff" font-size="11" text-anchor="middle" font-weight="700">출조 버스</text>
      <text x="45" y="46" fill="#9ad0ff" font-size="9" text-anchor="middle">지도 팝업 → 요금 ₩10,000</text>
    </g>
    <text x="890" y="676" fill="#0d2740" font-size="11" text-anchor="middle" font-weight="700">출조하기 지점</text>

    <!-- 숲(이동 불가 군집) -->
    <g fill="#3f7a34">
      <circle cx="380" cy="120" r="22"/><circle cx="345" cy="145" r="20"/><circle cx="410" cy="150" r="18"/>
      <circle cx="820" cy="120" r="22"/><circle cx="860" cy="145" r="20"/><circle cx="900" cy="118" r="18"/><circle cx="930" cy="150" r="16"/>
      <circle cx="920" cy="300" r="22"/><circle cx="950" cy="336" r="18"/><circle cx="900" cy="345" r="16"/>
      <circle cx="420" cy="620" r="22"/><circle cx="460" cy="650" r="20"/><circle cx="390" cy="660" r="18"/><circle cx="500" cy="628" r="16"/>
      <circle cx="640" cy="690" r="20"/><circle cx="690" cy="712" r="18"/>
    </g>
    <text x="380" y="180" fill="#20441c" font-size="10" text-anchor="middle">숲 (충돌 · 추후 벌목)</text>
    <text x="450" y="692" fill="#20441c" font-size="10" text-anchor="middle">숲 (충돌 · 추후 벌목)</text>

    <!-- 바위/그루터기 (이동 불가 단일 오브젝트) -->
    <g fill="#9aa4ae"><ellipse cx="740" cy="420" rx="20" ry="14"/><ellipse cx="350" cy="540" rx="16" ry="11"/><ellipse cx="560" cy="580" rx="14" ry="10"/></g>
    <g fill="#8a6a44"><circle cx="800" cy="240" r="12"/><circle cx="330" cy="330" r="11"/></g>
    <text x="740" y="450" fill="#4a5560" font-size="10" text-anchor="middle">바위(충돌)</text>
    <!-- 우물 -->
    <g transform="translate(770,320)"><circle r="14" fill="#8898a8"/><circle r="8" fill="#20303c"/><text x="0" y="30" fill="#33475a" font-size="10" text-anchor="middle">우물</text></g>
    <!-- 활어 수족관 자리 (야외 업소용 — 예약) -->
    <g transform="translate(716,196)">
      <rect x="0" y="0" width="76" height="44" fill="none" stroke="#2f7fd0" stroke-width="2" stroke-dasharray="6 4"/>
      <path d="M8,30 q10,-8 20,0 q10,8 20,0 q10,-8 20,0" fill="none" stroke="#2f7fd0" stroke-width="1.4" opacity="0.7"/>
      <text x="38" y="58" fill="#2f7fd0" font-size="10" text-anchor="middle">활어 수족관 예시 위치(자유 배치)</text>
    </g>
    <!-- 설치 모드 그리드 데모 (초록=가능 / 빨강=충돌 불가) -->
    <g transform="translate(500,545)">
      <g stroke="#0d2740" stroke-width="0.8" opacity="0.9">
        <rect x="0"   y="0"  width="26" height="26" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="26"  y="0"  width="26" height="26" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="52"  y="0"  width="26" height="26" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="78"  y="0"  width="26" height="26" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="104" y="0"  width="26" height="26" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="0"   y="26" width="26" height="26" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="26"  y="26" width="26" height="26" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="52"  y="26" width="26" height="26" fill="#ff5a4a" fill-opacity="0.55"/>
        <rect x="78"  y="26" width="26" height="26" fill="#ff5a4a" fill-opacity="0.55"/>
        <rect x="104" y="26" width="26" height="26" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="0"   y="52" width="26" height="26" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="26"  y="52" width="26" height="26" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="52"  y="52" width="26" height="26" fill="#ff5a4a" fill-opacity="0.55"/>
        <rect x="78"  y="52" width="26" height="26" fill="#4af2a1" fill-opacity="0.4"/>
        <rect x="104" y="52" width="26" height="26" fill="#4af2a1" fill-opacity="0.4"/>
      </g>
      <text x="65" y="96" fill="#0d2740" font-size="10.5" text-anchor="middle" font-weight="700">설치 모드 — 초록=가능 / 빨강=충돌(바위) 불가</text>
    </g>

    <!-- 갯바위 (해루질 예정 훅) -->
    <g fill="#6a747e"><ellipse cx="210" cy="700" rx="22" ry="12"/><ellipse cx="250" cy="726" rx="16" ry="9"/><ellipse cx="170" cy="726" rx="14" ry="8"/></g>
    <text x="212" y="752" fill="#33475a" font-size="10" text-anchor="middle">갯바위 (추후 해루질·채집)</text>
  </g>

  <!-- ===== 우측: 범례/규칙 ===== -->
  <g>
    <rect x="1000" y="72" width="256" height="700" rx="10" fill="#ffffff" stroke="#d3dde6"/>
    <text x="1016" y="100" fill="#0d2740" font-size="14" font-weight="700">범례 · 규칙</text>

    <rect x="1016" y="116" width="20" height="14" fill="url(#grass)"/><text x="1044" y="128" fill="#334" font-size="11">잔디 = 이동 가능</text>
    <rect x="1016" y="140" width="20" height="14" fill="#d8c8a0"/><text x="1044" y="152" fill="#334" font-size="11">길 = 이동 가능(가속 X)</text>
    <rect x="1016" y="164" width="20" height="14" fill="#3f8fc4"/><text x="1044" y="176" fill="#334" font-size="11">바다 = 이동 불가(~)</text>
    <circle cx="1026" cy="196" r="8" fill="#3f7a34"/><text x="1044" y="200" fill="#334" font-size="11">나무/숲 = 충돌(추후 벌목)</text>
    <ellipse cx="1026" cy="220" rx="9" ry="6" fill="#9aa4ae"/><text x="1044" y="224" fill="#334" font-size="11">바위/그루터기 = 충돌</text>
    <rect x="1018" y="238" width="16" height="10" fill="none" stroke="#8a4a2e" stroke-width="2" stroke-dasharray="5 3"/><text x="1044" y="248" fill="#334" font-size="11">울타리 = 제작 아이템(추후)</text>

    <line x1="1016" y1="268" x2="1240" y2="268" stroke="#e0e6ec"/>
    <text x="1016" y="292" fill="#0d2740" font-size="12.5" font-weight="700">저장 규칙</text>
    <text x="1016" y="312" fill="#334" font-size="11">· 저장 = 집 안 침대★에서만</text>
    <text x="1016" y="330" fill="#334" font-size="11">· 낚시 지역에선 저장 불가</text>
    <text x="1016" y="348" fill="#7a8a99" font-size="10.5">· (추후) 민박 등 거점 확장</text>

    <line x1="1016" y1="366" x2="1240" y2="366" stroke="#e0e6ec"/>
    <text x="1016" y="390" fill="#0d2740" font-size="12.5" font-weight="700">출조 플로우</text>
    <text x="1016" y="410" fill="#334" font-size="11">버스정류장 상호작용</text>
    <text x="1016" y="428" fill="#334" font-size="11">→ 대한민국 지도 팝업(기존)</text>
    <text x="1016" y="446" fill="#334" font-size="11">→ 구역 확정 시 ₩10,000 차감</text>
    <text x="1016" y="464" fill="#7a8a99" font-size="10.5">→ 잔액 부족 시 출조 불가</text>
    <text x="1016" y="482" fill="#7a8a99" font-size="10.5">→ (추후) 교통수단별 요금</text>

    <line x1="1016" y1="500" x2="1240" y2="500" stroke="#e0e6ec"/>
    <text x="1016" y="524" fill="#0d2740" font-size="12.5" font-weight="700">맵 스펙 (안)</text>
    <text x="1016" y="544" fill="#334" font-size="11">· 48×32 타일 단일 맵</text>
    <text x="1016" y="562" fill="#334" font-size="11">· 4방 경계 이동 불가</text>
    <text x="1016" y="580" fill="#334" font-size="11">· 바다 ≈30% / 땅 ≈70%</text>
    <text x="1016" y="598" fill="#334" font-size="11">· 기존 파이프라인 재사용</text>
    <text x="1016" y="614" fill="#7a8a99" font-size="10">  (pixelazed PNG → JSON)</text>

    <line x1="1016" y1="632" x2="1240" y2="632" stroke="#e0e6ec"/>
    <text x="1016" y="656" fill="#0d2740" font-size="12.5" font-weight="700">추후 훅</text>
    <text x="1016" y="674" fill="#334" font-size="11">· 텃밭 개간·농사 / 나무 벌목</text>
    <text x="1016" y="692" fill="#334" font-size="11">· 갯바위 해루질·채집</text>
    <text x="1016" y="710" fill="#334" font-size="11">· 선착장 개인 보트 출조</text>
    <text x="1016" y="728" fill="#b5541f" font-size="11" font-weight="700">· 설치형=칸 단위 자유 배치(충돌 제외)</text>
    <text x="1016" y="746" fill="#b5541f" font-size="11" font-weight="700">· 수족관 활어/관상 — 예시 위치일 뿐</text>
  </g>

  <text x="24" y="808" fill="#7a8a99" font-size="11">시작 지점: 새 게임 → 집 문 앞. 문 = 실내 맵 진입(침대 저장·주방). 지도상 X = 캐릭터가 걸어서 못 나감(경계·바다·충돌).</text>
  <text x="24" y="830" fill="#b5541f" font-size="11.5" font-weight="700">타일 문자 재사용: ~ 바다 · . 길/맨땅 · , 잔디 · # 건물/충돌 — 기존 build_region_maps 파이프라인으로 hometown 지역 생성.</text>
</svg>
