<title>Pixel Angler The Real Wiki</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--paper:#f4efe4;--card:#fffaf1;--ink:#18212a;--muted:#68737b;--sea:#155b68;--sea2:#d9edf0;--orange:#b54e25;--line:#d8cdbb;--shadow:0 8px 24px #17232a14}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Malgun Gothic",sans-serif}.wrap{max-width:1240px;margin:auto;padding:28px 18px 64px}.mast{display:flex;justify-content:space-between;gap:24px;align-items:end;border-bottom:3px double var(--line);padding:18px 0 22px}.kicker{color:var(--orange);font:700 11px/1.2 ui-monospace,monospace;letter-spacing:.16em}.mast h1{font:700 clamp(30px,5vw,54px)/1.08 Georgia,serif;margin:8px 0 0}.mast p{color:var(--muted);max-width:660px;margin:12px 0 0}.count{color:var(--sea);font:700 22px ui-monospace,monospace;white-space:nowrap}.toolbar{position:sticky;top:0;z-index:5;background:#f4efe4ee;padding:14px 0;display:flex;gap:10px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--card);color:var(--ink);font-size:15px}.toolbar button{border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);padding:9px 13px;cursor:pointer}.toolbar button.on{background:var(--sea);border-color:var(--sea);color:white}.layout{display:grid;grid-template-columns:180px 1fr;gap:22px}.nav{display:grid;align-content:start;gap:7px}.nav button{text-align:left;border:0;background:transparent;padding:9px 11px;border-radius:8px;color:var(--muted);cursor:pointer}.nav button.on{background:var(--sea2);color:var(--sea);font-weight:700}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:15px;box-shadow:var(--shadow)}.card h3{font:700 19px/1.25 Georgia,serif;margin:0 0 4px}.tag{display:inline-block;background:var(--sea2);color:var(--sea);border-radius:999px;padding:1px 8px;font-size:12px;margin:0 3px 5px 0}.muted{color:var(--muted);font-size:13px}.empty{padding:40px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:10px}@media(max-width:760px){.mast{display:block}.layout{grid-template-columns:1fr}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}}
</style>
<div class="wrap">
  <header class="mast"><div><div class="kicker">FIELD NOTES · COOKING · CRAFT · STORY</div><h1>Pixel Angler The Real Wiki</h1><p>조행록에서 시작한 기록을 요리, 손질, 제작, 농사, 아이템, 바다와 인물까지 확장한 게임 전체 안내서.</p></div><div class="count" id="count"></div></header>
  <div class="toolbar"><input id="search" placeholder="요리, 어종, 퀘스트, 아이템 검색"><button data-section="overview" class="on">개요</button><button data-section="quests">조행록</button><button data-section="cooking">요리</button><button data-section="fishing">어종</button><button data-section="crafting">제작</button><button data-section="items">아이템</button><button data-section="systems">시스템</button><button data-section="farming">농사</button><button data-section="world">월드</button><button data-section="survival">생존</button><button data-section="characters">캐릭터·대화</button></div>
  <main class="layout"><nav class="nav" id="nav"></nav><section id="content"></section></main>
</div>
<script>const DATA=__DATA__;
const esc=(v)=>String(v??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let section='overview';let query='';
const labels={overview:'개요',quests:'조행록',cooking:'요리',fishing:'어종',crafting:'제작',items:'아이템',systems:'시스템',farming:'농사',world:'월드',survival:'생존',characters:'캐릭터·대화'};
const hay=(x)=>JSON.stringify(x).toLowerCase().includes(query.toLowerCase());
const card=(title,body,tag='')=>`<article class="card"><h3>${esc(title)}</h3>${tag?`<span class="tag">${esc(tag)}</span>`:''}<div>${body}</div></article>`;
function render(){document.querySelectorAll('[data-section]').forEach((b)=>b.classList.toggle('on',b.dataset.section===section));document.getElementById('count').textContent=`${DATA.counts.quests} 퀘스트 · ${DATA.counts.recipes} 레시피`;
 const c=document.getElementById('content');let html='';
 if(section==='overview') html=`<div class="cards">${card('이 위키의 원칙','레시피와 완성 요리는 분리해 기록합니다. 요리 결과는 주재료와 품질을 가진 개체이며, 도감은 종류 단위로 누적됩니다.','설계')}${card('매운탕 두 갈래','서더리(머리·뼈) 매운탕과 어종 하나를 통째로 넣는 매운탕은 같은 빨간탕 계열이지만 서로 다른 레시피입니다.','핵심 변경')}${card('표시 규칙','요리 상세의 완성도는 숫자만 보여주지 않고 `★★★★☆`처럼 5칸 별로 표시합니다.','사용성')}</div>`;
 if(section==='cooking') html=`<div class="cards">${DATA.recipes.filter(hay).map((r)=>card(r.name,`<p>${esc(r.desc)}</p><div class="muted">주재료: ${esc(Array.isArray(r.main)?r.main.join(', '):r.main)} · 화구: ${esc(r.cookware.join(', '))}</div>`,r.family)).join('')}</div>`;
 if(section==='fishing') html=`<div class="cards">${DATA.fish.filter(hay).map((f)=>card(f.name,`<div class="muted">${esc(f.scientific)}</div><p>${esc(f.habitat)}</p>`,'어종')).join('')}</div>`;
 if(section==='crafting') html=`<div class="cards">${DATA.blueprints.filter(hay).map((b)=>card(b.name,`<p>${esc(b.desc)}</p><div class="muted">${esc(b.group)} · ${esc(b.station)}</div>`,'제작')).join('')}</div>`;
 if(section==='items') html=`<div class="cards">${DATA.items.filter(hay).map((i)=>card(i.name,`<div class="muted">${esc(i.id)}</div>`,'아이템')).join('')}</div>`;
 if(section==='systems') html=`<div class="cards">${DATA.systems.filter(hay).map((s)=>card(s.title,`<p>${esc(s.summary)}</p><div class="muted">docs/wiki/02-SYSTEMS/${esc(s.id)}.md</div>`,'시스템')).join('')}</div>`;
 if(section==='quests'){const qs=DATA.quests.quests.filter(hay);html=`<div class="cards">${qs.map((q)=>card(q.title,`<p>${esc(q.desc)}</p><div class="muted">${esc(q.giverName)} · ${esc(q.regionName)} · ${esc(q.diff.label)}</div>`,'퀘스트')).join('')}</div>`}
 if(['farming','world','survival','characters'].includes(section)){const words={farming:['farm','home','농사','텃밭','작물'],world:['world','region','field','지도','지역'],survival:['survival','food','생존','수분','허기'],characters:['character','dialogue','story','인물','대화']}[section];const ss=DATA.systems.filter((s)=>words.some((w)=>JSON.stringify(s).toLowerCase().includes(w.toLowerCase()))&&hay(s));html=`<div class="cards">${ss.map((s)=>card(s.title,`<p>${esc(s.summary)}</p><div class="muted">docs/wiki/02-SYSTEMS/${esc(s.id)}.md</div>`,labels[section])).join('')}</div>`}
 c.innerHTML=html||'<div class="empty">검색 결과가 없습니다.</div>';}
 document.getElementById('nav').innerHTML=Object.entries(labels).map(([id,label])=>`<button data-section="${id}">${label}</button>`).join('');document.querySelectorAll('[data-section]').forEach((b)=>b.addEventListener('click',()=>{section=b.dataset.section;render()}));document.getElementById('search').addEventListener('input',(e)=>{query=e.target.value;render()});render();</script>
