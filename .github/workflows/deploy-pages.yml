# 테스트 배포 — 고른 브랜치를 빌드해서 gh-pages 브랜치(= GitHub Pages)에 올린다.
#
# 손으로 하던 절차(스킬 deploy-ghpages 의 worktree 복사 · 커밋 · 푸시)를 그대로 옮긴 것이다.
# 실행은 사람이 한다: Actions → 「테스트 배포」 → Run workflow → 배포할 브랜치와 한 줄 요약을 적는다.
# 자동으로는 돌지 않는다(push · PR 에 반응하지 않는다).
name: 테스트 배포

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 배포할 브랜치 · 태그 · 커밋 (예 — main, harmony/2026-10-08-fines)
        required: true
        default: main
      note:
        description: 이번 배포에 든 변경 한 줄 요약 (커밋 메시지에 들어간다)
        required: false
        default: ''

# gh-pages 브랜치에 커밋하려면 쓰기 권한이 필요하다
permissions:
  contents: write

# 배포 둘이 겹치면 뒤의 것이 앞의 것을 기다린다(중간에 끊지 않는다)
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 빌드 · gh-pages 반영
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # pnpm 버전은 package.json 의 packageManager 필드(pnpm@9.15.0)를 따른다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 정적 호스팅에서 실제로 닿는 공공 API 는 기상청(apis.data.go.kr)뿐이다 — 그 키 하나만 넘긴다.
      # 저장소 비밀값에 이 이름이 없으면 빈 값으로 빌드되고, 게임은 날씨를 가상 데이터로 채운다(오류 아님).
      - name: 빌드 (core · client-pc · server)
        env:
          VITE_DATA_GO_KR_API_KEY: ${{ secrets.VITE_DATA_GO_KR_API_KEY }}
        run: pnpm run build

      - name: 배포본 검사
        run: |
          set -euo pipefail
          test -f packages/client-pc/dist/index.html
          # 서브패스 호스팅 — 선행 '/' 로 시작하는 에셋 주소는 배포에서만 404 가 난다
          if grep -nE "(src|href)=\"/[^/]" packages/client-pc/dist/index.html; then
            echo "::error::index.html 에 절대 경로 에셋이 있습니다 (vite base: './' 전제)"
            exit 1
          fi

      - name: gh-pages 브랜치 받기
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _pages

      - name: 배포본 옮기기 (소스맵 제외)
        run: |
          set -euo pipefail
          cd _pages
          # .git 과 .nojekyll 만 남기고 비운다 — 지난 배포의 남은 파일이 섞이지 않게
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .nojekyll -exec rm -rf {} +
          (cd ../packages/client-pc/dist && tar cf - --exclude='*.map' .) | tar xf -
          touch .nojekyll
          if find . -path ./.git -prune -o -name '*.map' -print | grep -q .; then
            echo "::error::소스맵이 배포본에 섞였습니다"
            exit 1
          fi

      - name: 커밋 · 푸시
        env:
          REF: ${{ inputs.ref }}
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          src_sha=$(git rev-parse --short HEAD)
          cd _pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다 — 이미 같은 내용이 배포돼 있습니다."
            exit 0
          fi
          # 배포 차수 = 직전 커밋 제목의 「Deploy: N차」 + 1 (못 읽으면 번호를 뺀다)
          prev=$(git log -1 --format=%s | sed -nE 's/^Deploy: ([0-9]+)차.*/\1/p')
          if [ -n "$prev" ]; then title="Deploy: $((prev + 1))차 테스트 빌드"; else title="Deploy: 테스트 빌드"; fi
          today=$(TZ=Asia/Seoul date +%F)
          msg="$title ($today) — $REF@$src_sha"
          if [ -n "$NOTE" ]; then msg="$msg · $NOTE"; fi
          git commit -q -m "$msg"
          git push origin gh-pages
          echo "### 배포했습니다" >> "$GITHUB_STEP_SUMMARY"
          echo "- $msg" >> "$GITHUB_STEP_SUMMARY"
          echo "- 반영까지 1~2분 걸립니다: https://sarsah93.github.io/Pixel-Angler-The-Real/" >> "$GITHUB_STEP_SUMMARY"
